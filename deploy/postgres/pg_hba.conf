# Client authentication for the single-host profile (ARCHITECTURE.md §24, §28).
#
# - The bootstrap superuser may connect only over the container-local socket,
#   as the matching OS user (used by the first-initialization hook and by
#   administrators inside the db container). It is never reachable over the
#   network.
# - The NOLOGIN owner (aitl_owner) has no entry: it can never log in.
# - Runtime roles connect over the network with SCRAM passwords, to the aitl
#   database only.
# - Everything else is rejected.
#
# TYPE  DATABASE  USER                                                          ADDRESS  METHOD
local   all       postgres                                                               peer
host    aitl      ingest_writer,intel_svc,scenario_gen,agent_svc,gateway_svc,eval_svc  all  scram-sha-256
local   all       all                                                                    reject
host    all       all                                                           all      reject
