# Client authentication for the single-host profile (ARCHITECTURE.md §24, §28).
#
# - The bootstrap superuser may connect only over the container-local socket,
#   as the matching OS user (used by the first-initialization hook and by
#   administrators inside the db container). It is never reachable over the
#   network.
# - The NOLOGIN owner (aitl_owner) has no entry: it can never log in.
# - Runtime roles connect over the network with SCRAM passwords, to the aitl
#   database only. The staging writer ingest_writer connects only from the
#   dedicated ingest-net subnet, which only the db and the Log Shipper join
#   (docker-compose.yml must declare the same subnet).
# - The deployment role aitl_migrator (ADR-022) connects only from the dedicated
#   migrate-net subnet, which only the db and the ephemeral db-migrate job join
#   (docker-compose.yml must declare the same subnet).
# - Everything else is rejected.
#
# TYPE  DATABASE  USER                                                          ADDRESS  METHOD
local   all       postgres                                                               peer
host    aitl      intel_svc,scenario_gen,agent_svc,gateway_svc,eval_svc                all  scram-sha-256
host    aitl      ingest_writer                                                 10.231.253.0/29  scram-sha-256
host    aitl      aitl_migrator                                                 10.231.254.0/29  scram-sha-256
local   all       all                                                                    reject
host    all       all                                                           all      reject
