# Alembic configuration. The database URL is never stored here: the migration
# job supplies AITL_MIGRATION_DSN (bootstrap admin credentials; never used by a
# runtime service). See migrations/env.py.
[alembic]
script_location = %(here)s
path_separator = os
version_locations = %(here)s/versions

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
