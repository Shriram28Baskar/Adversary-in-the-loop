# Adversary-in-the-Loop — single-host profile (ARCHITECTURE.md §28, §31).
#
#   deploy/secrets/generate.sh
#   docker compose --env-file deploy/versions.env up
#
# Network topology is the security boundary. It is verified by
# tests/security/test_compose_topology.py against ARCHITECTURE.md §28; any
# change here must keep that test passing. Services are added in the phase
# that implements them (engineering plan §4). Per-execution agent sandboxes
# are not Compose services: agent-runtime creates them on sandbox-net.
#
# The internet-exposed honeypot never runs from this file (PRD FR-004d); see
# deploy/honeypot-host/ (ADR-010).

name: aitl

services:
  db:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be set via deploy/versions.env}
    # Roles and database privileges: ARCHITECTURE.md §24. Runtime roles are
    # created on first initialization (10-init-roles.sh); schema objects and
    # grants come only from the Alembic migrations, owned by NOLOGIN aitl_owner.
    command: ["postgres", "-c", "hba_file=/etc/aitl/pg_hba.conf", "-c", "password_encryption=scram-sha-256"]
    environment:
      POSTGRES_DB: aitl
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
    secrets:
      - postgres_superuser_password
      - ingest_writer_password
      - intel_svc_password
      - scenario_gen_password
      - agent_svc_password
      - gateway_svc_password
      - eval_svc_password
      - aitl_migrator_password
    networks:
      - core-net
      - ingest-net
      - migrate-net
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/postgres/pg_hba.conf:/etc/aitl/pg_hba.conf:ro
      - ./deploy/postgres/init-roles.sql:/etc/aitl/init-roles.sql:ro
      - ./deploy/postgres/10-init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aitl"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Honeypot (isolation-test profile only; PRD FR-004, FR-004a, FR-004d) -------
  # Never started by `up`; no published port. It exists single-host only so the
  # isolation tests can prove zero egress. The internet-exposed honeypot runs
  # only on a separate host (ADR-010).
  #   docker compose --env-file deploy/versions.env --profile honeypot-isolation up honeypot
  honeypot:
    profiles: ["honeypot-isolation"]
    image: ${COWRIE_IMAGE:?COWRIE_IMAGE must be set via deploy/versions.env}
    user: "999:999"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    ulimits:
      nofile: 4096
    networks:
      - honeypot-net
    volumes:
      # Configuration: read-only (covers the image's etc VOLUME).
      - type: bind
        source: ./honeypot/cowrie/etc
        target: /cowrie/cowrie-git/etc
        read_only: true
      # The one-way telemetry volume: Cowrie's JSON log only (ARCHITECTURE.md §9).
      - type: volume
        source: honeypot-logs
        target: /cowrie/cowrie-git/var/log/cowrie
    tmpfs:
      # Covers the image's var VOLUME; size-bounded, never shared.
      - /cowrie/cowrie-git/var:size=16m,mode=0755,uid=999,gid=999
      # Host keys and recorded upload/download artifacts: Cowrie-only, bounded.
      - /cowrie/cowrie-git/var/lib/cowrie:size=64m,mode=0700,uid=999,gid=999
      - /tmp:size=16m,mode=1777

  # --- Log Shipper (ARCHITECTURE.md §9; PRD FR-004b, FR-005, FR-005b) ----------
  # Portless: no listener, no published or exposed port. Single-host profile runs
  # fixture mode over the version-controlled synthetic corpus (read-only); it
  # does not mount honeypot-logs. Live mode (honeypot-logs mounted read-only)
  # belongs to the separate honeypot-host profile (ADR-010). Only on ingest-net,
  # where its only peer is the db; INSERT-only as ingest_writer.
  log-shipper:
    build:
      context: .
      dockerfile: services/log_shipper/Dockerfile
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    environment:
      SHIPPER_MODE: fixture
      SHIPPER_SOURCE_DIR: /srv/aitl/source
      SHIPPER_STATE_DIR: /srv/aitl/state
      AITL_DB_HOST: db
      AITL_DB_PORT: "5432"
      AITL_DB_NAME: aitl
      AITL_DB_USER: ingest_writer
      AITL_DB_PASSWORD_FILE: /run/secrets/ingest_writer_password
    secrets:
      - ingest_writer_password
    networks:
      - ingest-net
    volumes:
      - type: bind
        source: ./corpus/honeypot_sessions_v1
        target: /srv/aitl/source
        read_only: true
      - type: volume
        source: shipper-state
        target: /srv/aitl/state
    tmpfs:
      - /tmp:size=8m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-m", "log_shipper.health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  # --- Ephemeral deployment jobs (not runtime services; ADR-022) ----------------
  # Runs only when invoked, exits, and is removed:
  #   docker compose --env-file deploy/versions.env run --rm db-migrate
  # Never started by `up` (non-default profile), no ports, no listener, only on
  # migrate-net, and the only holder of the migrator credential.
  db-migrate:
    profiles: ["deploy-jobs"]
    build:
      context: .
      dockerfile: deploy/migrate/Dockerfile
    restart: "no"
    read_only: true
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AITL_DB_HOST: db
      AITL_DB_PORT: "5432"
      AITL_DB_NAME: aitl
      AITL_MIGRATION_USER: aitl_migrator
      AITL_MIGRATION_PASSWORD_FILE: /run/secrets/aitl_migrator_password
      AITL_MIGRATION_WAIT_SECONDS: "60"
    secrets:
      - aitl_migrator_password
    networks:
      - migrate-net
    depends_on:
      db:
        condition: service_healthy

networks:
  # Attacker-facing; in the single-host profile it is internal with no
  # published port and used only by the honeypot isolation tests.
  honeypot-net:
    internal: true
  # Log Shipper -> db (intel_raw staging only). Fixed subnet: pg_hba.conf admits
  # ingest_writer only from this range.
  ingest-net:
    internal: true
    ipam:
      config:
        - subnet: 10.231.253.0/29
  # Core services; no honeypot access.
  core-net:
    internal: true
  # The running sandbox's only peer is gateway-service's sandbox listener.
  sandbox-net:
    internal: true
  # agent-runtime -> container-api-proxy only (ADR-019).
  orchestration-net:
    internal: true
  # Outbound for gateway-service's Model Proxy only (ADR-012).
  llm-egress: {}
  # Operator browser access to the dashboard, published on 127.0.0.1 only.
  operator-net: {}
  # db <-> ephemeral db-migrate job only (ADR-022). Fixed subnet: pg_hba.conf
  # admits aitl_migrator only from this range.
  migrate-net:
    internal: true
    ipam:
      config:
        - subnet: 10.231.254.0/29

volumes:
  db-data: {}
  # The Log Shipper's private read positions and health file; nothing else mounts it.
  shipper-state: {}
  # One-way honeypot telemetry: written by Cowrie only, read (read-only) only by
  # the Log Shipper in live mode. Size-bounded so a flood cannot fill the host.
  honeypot-logs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=256m,uid=999,gid=999,mode=0755"

secrets:
  postgres_superuser_password:
    file: deploy/secrets/generated/postgres_superuser_password
  ingest_writer_password:
    file: deploy/secrets/generated/ingest_writer_password
  intel_svc_password:
    file: deploy/secrets/generated/intel_svc_password
  scenario_gen_password:
    file: deploy/secrets/generated/scenario_gen_password
  agent_svc_password:
    file: deploy/secrets/generated/agent_svc_password
  gateway_svc_password:
    file: deploy/secrets/generated/gateway_svc_password
  eval_svc_password:
    file: deploy/secrets/generated/eval_svc_password
  aitl_migrator_password:
    file: deploy/secrets/generated/aitl_migrator_password
