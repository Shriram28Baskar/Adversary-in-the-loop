# Adversary-in-the-Loop — uv workspace root (virtual; not itself a package).
# Runtime dependencies live in each member's pyproject.toml and are pinned exactly.
# Development tooling is pinned exactly here. uv.lock pins the full transitive set.

[project]
name = "aitl-workspace"
version = "0.0.0"
requires-python = ">=3.11,<3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
aitl-common = { workspace = true }
aitl-log-shipper = { workspace = true }
aitl-intel-service = { workspace = true }

[dependency-groups]
dev = [
    "aitl-common",
    "aitl-log-shipper",
    "aitl-intel-service",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "types-pyyaml==6.0.12.20260906",
    {include-group = "migrate"},
]
# The ephemeral migration job's complete dependency set (ADR-022). Exported with
# hashes to deploy/migrate/requirements.txt; never installed in a runtime service.
migrate = [
    "alembic==1.20.0",
    "sqlalchemy==2.0.54",
    "psycopg[binary]==3.3.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "PT", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["aitl_common", "intel_service", "log_shipper", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, invoke fixed local CLIs (docker, git, psql, pg_ctl), and build
# probe SQL from fixed schema identifiers (never from input), so S608 is safe there.
"**/tests/**" = ["S101", "S104", "S603", "S607", "S608"]
"tests/**" = ["S101", "S104", "S603", "S607", "S608"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = ["packages/aitl_common/src", "services/intel_service/src", "services/log_shipper/src"]
explicit_package_bases = true
files = ["packages", "services", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["packages", "services", "tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
pythonpath = ["."]
xfail_strict = true
