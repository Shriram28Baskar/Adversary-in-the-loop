# Cowrie 3.0.15 overlay for Adversary-in-the-Loop (PRD FR-004, FR-004a; ARCHITECTURE.md §9).
#
# Cowrie reads its bundled cowrie.cfg.dist, then this file (last wins per key).
# Every security-relevant key is set explicitly here rather than relying on a
# default, and tests/security/test_cowrie_config.py checks the effective
# configuration (bundled defaults of the pinned release + this overlay).
#
# Defense in depth only: the primary control is network-layer zero egress
# (an internal network single-host; host firewall on the honeypot host).
#
# Do not set COWRIE_* environment variables anywhere: Cowrie lets them
# override this file, and the Compose topology test rejects them.

[honeypot]
# Fake identity; nothing here is real.
hostname = srv-backup-02
sensor_name = aitl-honeypot
log_path = var/log/cowrie
state_path = var/lib/cowrie
download_path = ${honeypot:state_path}/downloads
etc_path = etc
# Session TTY recordings are not needed (the JSON log carries the commands).
ttylog = false
# The in-process shell emulator only: never the proxy/pool backend (which
# would connect to real VMs) or an LLM backend (which would call an API).
backend = shell
auth_class = UserDB
logtype = rotating
timezone = UTC
# Download/fetch emulation cannot be removed by configuration in 3.0.15, so it
# is made to fail: every outbound socket Cowrie's commands open (wget, curl,
# ftpget, tftp, nc) binds to this address, and a loopback-bound socket cannot
# reach any other host. Any transfer that did start aborts after 1 byte.
out_addr = 127.0.0.1
download_limit_size = 1
idle_timeout = 180
authentication_timeout = 120

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
# No direct-tcpip (port forwarding): forwarding requests are refused, and the
# redirect/tunnel features stay off.
forwarding = false
forward_redirect = false
forward_tunnel = false
auth_keyboard_interactive_enabled = false
auth_publickey_allow_any = false

[telnet]
enabled = false

# The only output: JSON lines on the one-way honeypot-logs volume.
[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false
# Every other output plugin (network, database or file sinks) stays disabled.
[output_xmpp]
enabled = false

[output_elasticsearch]
enabled = false

