# LLM agent configuration v1 (PRD FR-001, FR-031; ARCHITECTURE.md §15, §37.5).
# One provider and one pinned model identifier (engineering decision, see
# config/README.md). The provider key and base URL are Gateway (Model Proxy)
# deployment configuration and never appear here.
agent_id: assistant_llm
version: 1
agent_kind: llm
role: assistant
model: {provider: anthropic, model_id: claude-sonnet-5}
generation: {temperature: 0, max_tokens: 2048}
system_prompt: {prompt_id: system, version: 1}
tool_definitions_version: tool-definitions-v1
agent_loop_version: agent-loop-v1
limits: {max_steps: 20, model_call_budget: 25, timeout_seconds: 120}
