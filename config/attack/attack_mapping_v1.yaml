# ATT&CK mapping v1 (PRD FR-009, FR-010; ARCHITECTURE.md §12, §37.1).
# One pinned ATT&CK Enterprise release; the curated 14-technique subset.
# Each TTP label maps to exactly one tactic and one or more techniques.
# Labels in unmapped_labels are recorded as `unmapped` (FR-010), never forced.
version: attack-mapping-v1
attack_release:
  domain: enterprise-attack
  version: "15.1"
tactics:
  - {id: TA0043, name: Reconnaissance}
  - {id: TA0006, name: Credential Access}
  - {id: TA0007, name: Discovery}
  - {id: TA0009, name: Collection}
  - {id: TA0010, name: Exfiltration}
  - {id: TA0002, name: Execution}
  - {id: TA0011, name: Command and Control}
techniques:
  - {id: T1595, tactic_id: TA0043, name: Active Scanning}
  - {id: T1110.001, tactic_id: TA0006, name: Password Guessing}
  - {id: T1552.001, tactic_id: TA0006, name: Credentials In Files}
  - {id: T1552.004, tactic_id: TA0006, name: Private Keys}
  - {id: T1082, tactic_id: TA0007, name: System Information Discovery}
  - {id: T1083, tactic_id: TA0007, name: File and Directory Discovery}
  - {id: T1033, tactic_id: TA0007, name: System Owner/User Discovery}
  - {id: T1057, tactic_id: TA0007, name: Process Discovery}
  - {id: T1087.001, tactic_id: TA0007, name: Local Account}
  - {id: T1016, tactic_id: TA0007, name: System Network Configuration Discovery}
  - {id: T1005, tactic_id: TA0009, name: Data from Local System}
  - {id: T1048, tactic_id: TA0010, name: Exfiltration Over Alternative Protocol}
  - {id: T1059.004, tactic_id: TA0002, name: Unix Shell}
  - {id: T1105, tactic_id: TA0011, name: Ingress Tool Transfer}
ttp_map:
  - {label: active_scanning, tactic_id: TA0043, technique_ids: [T1595]}
  - {label: password_guessing, tactic_id: TA0006, technique_ids: [T1110.001]}
  - {label: credentials_in_files, tactic_id: TA0006, technique_ids: [T1552.001]}
  - {label: private_keys, tactic_id: TA0006, technique_ids: [T1552.004]}
  - {label: system_information_discovery, tactic_id: TA0007, technique_ids: [T1082]}
  - {label: file_and_directory_discovery, tactic_id: TA0007, technique_ids: [T1083]}
  - {label: system_owner_user_discovery, tactic_id: TA0007, technique_ids: [T1033]}
  - {label: process_discovery, tactic_id: TA0007, technique_ids: [T1057]}
  - {label: local_account_discovery, tactic_id: TA0007, technique_ids: [T1087.001]}
  - {label: network_configuration_discovery, tactic_id: TA0007, technique_ids: [T1016]}
  - {label: data_from_local_system, tactic_id: TA0009, technique_ids: [T1005]}
  - {label: exfiltration_alternative_protocol, tactic_id: TA0010, technique_ids: [T1048]}
  - {label: unix_shell_execution, tactic_id: TA0002, technique_ids: [T1059.004]}
  - {label: ingress_tool_transfer, tactic_id: TA0011, technique_ids: [T1105]}
# Observed behavior outside the curated subset (e.g. cryptominer launch, which
# would be T1496) is recorded as unmapped rather than forced into a technique.
unmapped_labels: [resource_hijacking]
