[project]
name = "aitl-intel-service"
version = "0.1.0"
description = "intel-service: promotion of staged telemetry and deterministic behavior reconstruction (P4)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "aitl-common",
]

[tool.uv.sources]
aitl-common = { workspace = true }

[build-system]
requires = ["uv_build==0.8.17"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "intel_service"
